<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/output.css">
    <title>Document</title>
    <style>


body {

}
.card-parent{
    perspective: 1500px;

}
.card {
  font-weight: bold;
  padding: 1em;
  text-align: left;
  color: #181a1a;
  width:  300px;
  height: 400px;
  box-shadow: 0 1px 5px #00000099;
  border-radius: 10px;
  background-image: url(img/games-section/4.webp);
  background-size: cover;
  position: relative;
  transition: transform, box-shadow .3s ease-in-out;
  transform: rotate3d(0);
  display: block;
}

.card:hover {
  transition-duration: 150ms;
  box-shadow: 0 5px 20px 5px #00000044;
}

.card .glow {
  position: absolute;
  width: 100%;
  height: 100%;
  left: 0;
  top: 0;
  
  background-image: radial-gradient(circle at 50% -20%, #ffffff22, #0000000f);
}
    </style>
</head>

<body class="h-screen flex justify-center items-center gap-3">
    
<div class="card-parent">
    <a href="#" class="card">
        3D Card
        <div class="glow"></div>
    </a>
</div>
<div class="card-parent">
    <a href="#" class="card">
        3D Card
        <div class="glow"></div>
    </a>
</div>

    <script>
     const card = document.querySelectorAll('.card');
    let bounds;

function rotateToMouse(elem , e) {
        console.log(elem);
        
  const mouseX = e.clientX;
  const mouseY = e.clientY;
  const leftX = mouseX - bounds.x;
  const topY = mouseY - bounds.y;
  const center = {
    x: leftX - bounds.width / 2,
    y: topY - bounds.height / 2
  }
  const distance = Math.sqrt(center.x**2 + center.y**2);
  
  elem.style.transform = `
   
    rotate3d(
      ${center.y / 100},
      ${-center.x / 100},
      0,
      ${Math.log(distance)* 2}deg
    )
  `;
  
  elem.querySelector('.glow').style.backgroundImage = `
    radial-gradient(
      circle at
      ${center.x * 2 + bounds.width/2}px
      ${center.y * 2 + bounds.height/2}px,
      #ffffff55,
      #0000000f
    )
  `;
}

card.forEach(elem=>{
  elem.addEventListener('mousemove', (e) => {
      bounds = elem.getBoundingClientRect();
        rotateToMouse(elem , e)
    });
})

card.forEach(elem=>{
    elem.addEventListener('mouseleave', () => {
      elem.style.transform = '';
      elem.style.background = '';
    });

})
    </script>
</body>
</html>
