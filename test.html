<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/output.css">
<!-- در بخش head -->
<link href="https://cdn.jsdelivr.net/npm/nouislider@15.7.0/dist/nouislider.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/nouislider@15.7.0/dist/nouislider.min.js"></script>

    <title>Document</title>





</head>

<body class="h-screen">


  <div class="w-full max-w-xs mx-auto text-white font-sans">
  <div class="flex items-center justify-between mb-2 text-sm">
    <span id="min-year" class="text-indigo-500 font-bold">1888</span>
    <span class="text-white">سال ساخت</span>
    <span id="max-year" class="text-indigo-500 font-bold">2025</span>
  </div>

  <div id="slider-year" class="custom-slider max-h-1.5"></div>
</div>

<button onclick="test()">sub</button>



<script>
  const slider = document.getElementById('slider-year');
  const minYear = document.getElementById('min-year');
  const maxYear = document.getElementById('max-year');

  noUiSlider.create(slider, {
    start: [1888, 2025],
    connect: true,
    step: 1,
    direction: 'ltr',
    range: {
      min: 1888,
      max: 2025
    },
    format: {
      to: value => Math.round(value), // اعداد انگلیسی
      from: value => Number(value)
    }
  });

  slider.noUiSlider.on('update', (values, handle) => {
    if (handle === 0) minYear.textContent = values[0];
    else maxYear.textContent = values[1];
  });
 
  function test(){

    const values = slider.noUiSlider.get(); // مقدار هر دو دسته
    console.log("Min:", values[0]);
    console.log("Max:", values[1]);
  }

</script>



</body>
</html>
