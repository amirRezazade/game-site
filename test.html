body {

}
.card-parent{
    perspective: 1500px;

}
.card {
  font-weight: bold;
  padding: 1em;
  text-align: left;
  color: #181a1a;
  width:  300px;
  height: 400px;
  box-shadow: 0 1px 5px #00000099;
  border-radius: 10px;
  background-image: url(img/games-section/4.webp);
  background-size: cover;
  position: relative;
  transition: transform, box-shadow .3s ease-in-out;
  transform: rotate3d(0);
  display: block;
}

.card:hover {
  transition-duration: 150ms;
  box-shadow: 0 5px 20px 5px #00000044;
}

.card .glow {
  position: absolute;
  width: 100%;
  height: 100%;
  left: 0;
  top: 0;
  
  background-image: radial-gradient(circle at 50% -20%, #ffffff22, #0000000f);
}
